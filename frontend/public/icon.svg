<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1128"/>
      <stop offset="50%" stop-color="#141e30"/>
      <stop offset="100%" stop-color="#243b55"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="45%" r="35%">
      <stop offset="0%" stop-color="#ff758f"/>
      <stop offset="60%" stop-color="#e63946"/>
      <stop offset="100%" stop-color="#b5179e"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffeaa7"/>
      <stop offset="100%" stop-color="#d4af37"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  
  <!-- Rising Sun Motif -->
  <circle cx="256" cy="230" r="130" fill="url(#sun)" opacity="0.95"/>
  
  <!-- Stylized Torii Gate -->
  <!-- Top lintel curved (Kasagi) -->
  <path d="M 96 175 Q 256 150 416 175 L 426 195 Q 256 172 86 195 Z" fill="#ffffff"/>
  <!-- Second lintel (Shimaki / Nuki) -->
  <rect x="120" y="215" width="272" height="20" rx="3" fill="#ffffff" opacity="0.95"/>
  <!-- Central pillar tie (Gakuzuka) -->
  <rect x="246" y="185" width="20" height="35" rx="2" fill="url(#gold)"/>
  <!-- Vertical pillars (Hashira) -->
  <path d="M 160 215 L 145 400 L 175 400 L 185 215 Z" fill="#ffffff"/>
  <path d="M 352 215 L 367 400 L 337 400 L 327 215 Z" fill="#ffffff"/>
  <!-- Base blocks (Nemaki) -->
  <rect x="135" y="385" width="48" height="22" rx="4" fill="url(#gold)"/>
  <rect x="329" y="385" width="48" height="22" rx="4" fill="url(#gold)"/>
  
  <!-- Sakura Petals floating -->
  <circle cx="120" cy="130" r="8" fill="#ff758f" opacity="0.8"/>
  <circle cx="390" cy="120" r="10" fill="#ffb7b2" opacity="0.8"/>
  <circle cx="370" cy="310" r="7" fill="#ff758f" opacity="0.7"/>
  <circle cx="110" cy="330" r="9" fill="#ffb7b2" opacity="0.7"/>
  <circle cx="270" cy="110" r="11" fill="#ff758f" opacity="0.85"/>
</svg>
